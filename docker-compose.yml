services:
  backend:
    build: ./backend
    environment:
      - TRADING_ENABLED=${TRADING_ENABLED:-false}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - CALLBACK_BASE_URL=${CALLBACK_BASE_URL:-http://localhost}
    volumes:
      - ./backend/data:/app/data
      - ./backend/strategies:/app/strategies:ro
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
